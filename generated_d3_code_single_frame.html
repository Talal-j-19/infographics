<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Searching Algorithms</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        svg { background-color: #f8f8f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .title { font-size: 32px; font-weight: bold; fill: #333; }
        .intro-text { font-size: 16px; fill: #555; }
        .section-title { font-size: 22px; font-weight: bold; fill: #2c3e50; }
        .description { font-size: 14px; fill: #555; }
        .code-complexity { font-size: 16px; font-weight: bold; fill: #e74c3c; }
        .array-cell-rect { fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 1; }
        .array-cell-text { font-size: 16px; text-anchor: middle; fill: #333; }
        .highlight-cell { fill: #2ecc71; } /* Green for target/found */
        .pointer-text { font-size: 13px; font-weight: bold; fill: #c0392b; }
        .comparison-header { font-size: 16px; font-weight: bold; fill: #2980b9; }
        .comparison-label { font-size: 14px; font-weight: bold; fill: #34495e; }
        .comparison-value { font-size: 14px; fill: #7f8c8d; }
    </style>
</head>
<body>
    <script>
        const svgWidth = 1000;
        const svgHeight = 700; // Increased height to accommodate content without crowding

        const svg = d3.select("body").append("svg")
            .attr("width", svgWidth)
            .attr("height", svgHeight);

        // Definitions for reusable SVG elements like arrow markers
        svg.append("defs")
            .append("marker")
            .attr("id", "arrowhead")
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", "9") // Point of arrow tip relative to viewBox
            .attr("refY", "0")
            .attr("markerWidth", "8") // Size of the marker
            .attr("markerHeight", "8")
            .attr("orient", "auto") // Auto-orient based on path direction
            .append("path")
            .attr("d", "M0,-5L10,0L0,5Z")
            .attr("fill", "#c0392b"); // Red for emphasis

        // Add a blue arrowhead for binary search conceptual arrows
        svg.append("defs")
            .append("marker")
            .attr("id", "blue-arrowhead")
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", "9")
            .attr("refY", "0")
            .attr("markerWidth", "8")
            .attr("markerHeight", "8")
            .attr("orient", "auto")
            .append("path")
            .attr("d", "M0,-5L10,0L0,5Z")
            .attr("fill", "#2980b9"); // Blue color for consistency

        // Main Title
        svg.append("text")
            .attr("x", svgWidth / 2)
            .attr("y", 50)
            .attr("text-anchor", "middle")
            .attr("class", "title")
            .text("Searching Algorithms: Linear vs. Binary");

        // Introduction Text
        const introText = svg.append("text")
            .attr("x", 50)
            .attr("y", 95)
            .attr("class", "intro-text");
        introText.append("tspan")
            .attr("x", 50)
            .text("Discover how algorithms locate items in datasets. This infographic compares two fundamental methods:");
        introText.append("tspan")
            .attr("x", 50)
            .attr("dy", "1.2em") // Move to next line
            .text("Linear Search and Binary Search, highlighting their mechanisms and efficiency tradeoffs.");

        const arrayBoxWidth = 40;
        const arrayBoxHeight = 40;
        const arrayBoxPadding = 5;
        const totalArrayBoxSize = arrayBoxWidth + arrayBoxPadding;

        // --- Linear Search Section ---
        const linearSearchGroup = svg.append("g")
            .attr("transform", "translate(50, 140)");

        linearSearchGroup.append("text")
            .attr("x", 0)
            .attr("y", 0)
            .attr("class", "section-title")
            .text("1. Linear Search (Sequential)");

        const linearDescription = linearSearchGroup.append("text")
            .attr("x", 0)
            .attr("y", 30)
            .attr("class", "description");
        linearDescription.append("tspan")
            .attr("x", 0)
            .text("Examines each element sequentially until the target is found or");
        linearDescription.append("tspan")
            .attr("x", 0)
            .attr("dy", "1.2em")
            .text("the list ends. Works on unsorted data.");

        // Linear Search Array Visualization
        const linearData = ["10", "5", "20", "15", "8", "3"];
        const linearTargetIndex = 3; // Target is "15"

        const linearArrayGroup = linearSearchGroup.append("g")
            .attr("transform", "translate(0, 120)"); // Moved array down to make space for scan path

        linearData.forEach((d, i) => {
            linearArrayGroup.append("rect")
                .attr("x", i * totalArrayBoxSize)
                .attr("y", 0)
                .attr("width", arrayBoxWidth)
                .attr("height", arrayBoxHeight)
                .attr("class", "array-cell-rect")
                .classed("highlight-cell", i === linearTargetIndex); // Highlight target
            linearArrayGroup.append("text")
                .attr("x", i * totalArrayBoxSize + arrayBoxWidth / 2)
                .attr("y", arrayBoxHeight / 2 + 6) // Center text vertically
                .attr("class", "array-cell-text")
                .text(d);
        });

        // Linear Search Scan Path (adjusted to be above array, pointing to target)
        // Path needs to be relative to linearSearchGroup. Array starts at Y=120 within this group.
        const linearPathY = 100; // Y position for the path, above the array boxes
        const linearPathStartX = 0 * totalArrayBoxSize + arrayBoxWidth / 2 - 20; // Start slightly before the first element
        const linearPathEndX = linearTargetIndex * totalArrayBoxSize + arrayBoxWidth / 2; // End at the center of the target element

        linearSearchGroup.append("path")
            .attr("d", `M ${linearPathStartX},${linearPathY} L ${linearPathEndX},${linearPathY}`)
            .attr("stroke", "#c0392b")
            .attr("stroke-width", "2")
            .attr("marker-end", "url(#arrowhead)")
            .attr("fill", "none");
        
        linearSearchGroup.append("text")
            .attr("x", (linearPathEndX + linearPathStartX)/2)
            .attr("y", linearPathY - 10)
            .attr("text-anchor", "middle")
            .attr("class", "pointer-text")
            .text("Scan Direction"); // More descriptive text

        linearSearchGroup.append("text")
            .attr("x", 0)
            .attr("y", 200)
            .attr("class", "code-complexity")
            .text("Time Complexity: O(N)");

        linearSearchGroup.append("text")
            .attr("x", 0)
            .attr("y", 225)
            .attr("class", "description")
            .text("Condition: Data can be unsorted.");


        // --- Binary Search Section ---
        const binarySearchGroup = svg.append("g")
            .attr("transform", `translate(${svgWidth / 2 + 20}, 140)`);

        binarySearchGroup.append("text")
            .attr("x", 0)
            .attr("y", 0)
            .attr("class", "section-title")
            .text("2. Binary Search (Divide & Conquer)");

        const binaryDescription = binarySearchGroup.append("text")
            .attr("x", 0)
            .attr("y", 30)
            .attr("class", "description");
        binaryDescription.append("tspan")
            .attr("x", 0)
            .text("Locates an item by repeatedly dividing the search interval in half.");
        binaryDescription.append("tspan")
            .attr("x", 0)
            .attr("dy", "1.2em")
            .text("Highly efficient, but requires data to be *sorted*.");

        // Binary Search Array Visualization
        const binaryData = ["5", "10", "15", "20", "25", "30", "35"];
        const binaryTargetValue = "20"; // Example target
        const midIndex = Math.floor(binaryData.length / 2); // Initial mid is 20 (index 3)
        const midXPos = midIndex * totalArrayBoxSize + arrayBoxWidth / 2;

        const binaryArrayGroup = binarySearchGroup.append("g")
            .attr("transform", "translate(0, 120)"); // Moved array down to match linear search layout

        binaryData.forEach((d, i) => {
            binaryArrayGroup.append("rect")
                .attr("x", i * totalArrayBoxSize)
                .attr("y", 0)
                .attr("width", arrayBoxWidth)
                .attr("height", arrayBoxHeight)
                .attr("class", "array-cell-rect")
                .classed("highlight-cell", d === binaryTargetValue); // Highlight target
            binaryArrayGroup.append("text")
                .attr("x", i * totalArrayBoxSize + arrayBoxWidth / 2)
                .attr("y", arrayBoxHeight / 2 + 6)
                .attr("class", "array-cell-text")
                .text(d);
        });

        // Binary Search Pointers (conceptual) - Adjusted Y positions for more space
        const arrayBaseY = 120 + arrayBoxHeight; // Base of the array visualization in binarySearchGroup coord
        const lowX = 0 * totalArrayBoxSize + arrayBoxWidth / 2;
        const highX = (binaryData.length - 1) * totalArrayBoxSize + arrayBoxWidth / 2;

        binarySearchGroup.append("text")
            .attr("x", lowX)
            .attr("y", arrayBaseY + 20)
            .attr("text-anchor", "middle")
            .attr("class", "pointer-text")
            .text("Low");

        binarySearchGroup.append("text")
            .attr("x", highX)
            .attr("y", arrayBaseY + 20)
            .attr("text-anchor", "middle")
            .attr("class", "pointer-text")
            .text("High");

        binarySearchGroup.append("text")
            .attr("x", midXPos)
            .attr("y", arrayBaseY + 40)
            .attr("text-anchor", "middle")
            .attr("class", "pointer-text")
            .text("Mid");

        // Conceptual arrows for narrowing search space (adjusted Y positions and text placement)
        const arrowStartGlobalY = arrayBaseY + 55; // Slightly below Mid pointer
        const arrowEndGlobalY = arrayBaseY + 80;

        // Arrow from Mid to left half (if target < Mid)
        binarySearchGroup.append("path")
            .attr("d", `M ${midXPos},${arrowStartGlobalY} L ${midXPos - totalArrayBoxSize * 1.5},${arrowEndGlobalY}`)
            .attr("stroke", "#2980b9")
            .attr("stroke-width", "2")
            .attr("marker-end", "url(#blue-arrowhead)") // Use blue arrowhead
            .attr("fill", "none");
        binarySearchGroup.append("text")
            .attr("x", midXPos - totalArrayBoxSize * 1.5 - 5)
            .attr("y", arrowEndGlobalY + 15) // Move text down to prevent overlap with arrowhead
            .attr("text-anchor", "end")
            .attr("class", "description")
            .style("font-style", "italic")
            .text("If Target < Mid, search left ↘");

        // Arrow from Mid to right half (if target > Mid)
        binarySearchGroup.append("path")
            .attr("d", `M ${midXPos},${arrowStartGlobalY} L ${midXPos + totalArrayBoxSize * 1.5},${arrowEndGlobalY}`)
            .attr("stroke", "#2980b9")
            .attr("stroke-width", "2")
            .attr("marker-end", "url(#blue-arrowhead)") // Use blue arrowhead
            .attr("fill", "none");
        binarySearchGroup.append("text")
            .attr("x", midXPos + totalArrayBoxSize * 1.5 + 5)
            .attr("y", arrowEndGlobalY + 15) // Move text down
            .attr("text-anchor", "start")
            .attr("class", "description")
            .style("font-style", "italic")
            .text("↙ If Target > Mid, search right");

        binarySearchGroup.append("text")
            .attr("x", 0)
            .attr("y", 280) // Moved down to avoid overlap with conceptual arrows/text
            .attr("class", "code-complexity")
            .text("Time Complexity: O(log N)");
        
        binarySearchGroup.append("text")
            .attr("x", 0)
            .attr("y", 305) // Moved down
            .attr("class", "description")
            .text("Condition: Data must be sorted.");

        // --- Key Differences Section ---
        const comparisonGroup = svg.append("g")
            .attr("transform", "translate(50, 489)"); // Adjusted Y position to create more space after search sections

        comparisonGroup.append("text")
            .attr("x", 370) // Centered over the 3 comparison columns
            .attr("y", 0)
            .attr("text-anchor", "middle")
            .attr("class", "section-title")
            .text("Key Differences");

        const comparisonYStart = 40;
        const col1X = 0;
        const col2X = 220; // Adjusted for more horizontal space
        const col3X = 490; // Adjusted for more horizontal space

        // Headers
        comparisonGroup.append("text")
            .attr("x", col2X)
            .attr("y", comparisonYStart)
            .attr("class", "comparison-header")
            .text("Linear Search");
        comparisonGroup.append("text")
            .attr("x", col3X)
            .attr("y", comparisonYStart)
            .attr("class", "comparison-header")
            .text("Binary Search");
        
        const comparisonItems = [
            { label: "Data Requirement:", ls: "Unsorted", bs: "Sorted" },
            { label: "Approach:", ls: "Sequential", bs: "Divide & Conquer" },
            { label: "Performance:", ls: "O(N) - Slower for large N", bs: "O(log N) - Fast for large N" },
            { label: "Best Use Case:", ls: "Small or unsorted lists", bs: "Large, sorted datasets" }
        ];

        comparisonItems.forEach((item, i) => {
            const yOffset = comparisonYStart + (i + 1) * 30; // 30px spacing per row
            comparisonGroup.append("text")
                .attr("x", col1X)
                .attr("y", yOffset)
                .attr("class", "comparison-label")
                .text(item.label);
            comparisonGroup.append("text")
                .attr("x", col2X)
                .attr("y", yOffset)
                .attr("class", "comparison-value")
                .text(item.ls);
            comparisonGroup.append("text")
                .attr("x", col3X)
                .attr("y", yOffset)
                .attr("class", "comparison-value")
                .text(item.bs);
        });

    </script>
</body>
</html>
