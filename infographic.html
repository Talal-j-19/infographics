      const width = 1000;

          const g = svg.append("g")
            .attr("id", element.id)
            .attr("transform", element.transform);
          if (element.class) g.attr("class", element.class);
          element.children.forEach(child => {
            if (child.type === "rect") {
              g.append("rect")
                .attr("id", child.id)
                .attr("x", child.x)
                .attr("y", child.y)
                .attr("width", child.width)
                .attr("height", child.height)
                .attr("rx", child.rx)
                .attr("ry", child.ry)
                .attr("fill", child.fill)
                .attr("stroke", child.stroke)
                .attr("stroke-width", child.stroke_width);
            } else if (child.type === "circle") {
              g.append("circle")
                .attr("id", child.id)
                .attr("cx", child.cx)
                .attr("cy", child.cy)
                .attr("r", child.r)
                .attr("fill", child.fill)
                .attr("stroke", child.stroke)
                .attr("stroke-width", child.stroke_width);
            } else if (child.type === "text") {
              g.append("text")
                .attr("id", child.id)
                .attr("x", child.x)
                .attr("y", child.y)
                .attr("font-size", child.font_size)
                .attr("font-weight", child.font_weight || "normal")
                .attr("text-anchor", child.text_anchor || "start")
                .attr("fill", child.fill)
                .text(child.text_content);
            }
          });
        } else if (element.type === "circle") {

            .attr("stroke-width", element.stroke_width)

        } else if (element.type === "line") {
